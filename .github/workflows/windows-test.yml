name: Windows test
on: [push, workflow_dispatch]
jobs:
  smoke:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Setup (setup.ps1, same as users run)
        shell: powershell
        run: powershell -NoProfile -ExecutionPolicy Bypass -File skills\gta6-clipper\scripts\setup.ps1
      - name: Smoke test (prep, render, live start/status/clip/stop)
        shell: powershell
        run: |
          $cfg = Get-Content skills\gta6-clipper\config.json | ConvertFrom-Json
          foreach ($d in $cfg.path_dirs) { $env:Path = "$d;$env:Path" }
          skills\gta6-clipper\.venv\Scripts\python.exe tests\smoke.py
